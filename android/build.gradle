def args = ["-Xlint:deprecation"]

group 'com.eyedeadevelopment.fluttertts'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(args)
}

apply plugin: 'com.android.library'
// AGP 9 provides Kotlin unless the host explicitly opts out.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinEnabled = agpMajor >= 9 && providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(true)
        .get()
if (!builtInKotlinEnabled) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdk 36
    if (project.android.hasProperty("namespace")) {
        namespace 'com.eyedeadevelopment.fluttertts'
    }

    defaultConfig {
        minSdkVersion 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
        disable 'GradleDependency'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    // Built-in Kotlin inherits the Java target; legacy KGP needs this option.
    if (!builtInKotlinEnabled) {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
repositories {
    mavenCentral()
}
